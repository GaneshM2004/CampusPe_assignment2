<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusPe Chat UI</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="d-flex" id="app-container">

        <aside class="sidebar bg-dark text-white p-3 d-flex flex-column" id="chat-sidebar">
            <!-- Sidebar Header with toggle close button -->
            <div class="sidebar-top d-flex align-items-center justify-content-between mb-3">
                <span class="sidebar-brand">CampusPe AI</span>
                <button class="btn btn-sm btn-icon sidebar-close-btn" id="sidebar-close-btn" title="Close sidebar">
                    <i class="fas fa-chevron-left"></i>
                </button>
            </div>
            <button class="btn btn-outline-light w-100 mb-4" id="new-chat-btn">
                <i class="fas fa-plus me-2"></i> New Chat
            </button>
            <div class="chat-history flex-grow-1 overflow-auto">
            </div>
            <div class="user-profile mt-auto pt-3 border-top border-secondary">
                <div class="d-flex align-items-center justify-content-end mb-3">
                    Ganesh Mulgund <i class="fas fa-user-circle fa-2x ms-2"></i>
                </div>
                <button class="btn btn-sm btn-outline-light w-100" id="theme-toggle-btn">
                    <i class="fas fa-moon me-2"></i> Dark Mode
                </button>
            </div>
        </aside>

        <main class="flex-grow-1 d-flex flex-column position-relative h-100">

            <header class="main-header p-3 border-bottom d-flex align-items-center">
                <button class="btn btn-light me-3" id="mobile-menu-btn" title="Toggle sidebar">
                    <i class="fas fa-bars"></i>
                </button>
                <h5 class="m-0">New Chat</h5>
            </header>

            <section class="messages-container flex-grow-1 overflow-auto p-4" id="messages-area">

                <div class="welcome-screen text-center h-100 d-flex flex-column justify-content-center align-items-center"
                    id="welcome-section">
                    <i class="fas fa-robot fa-4x mb-3 text-primary"></i>
                    <h2>How can I help you today?</h2>

                    <div class="row g-3 mt-4 w-100" style="max-width: 800px;">
                        <div class="col-12 col-md-6">
                            <div class="card h-100 suggestion-card cursor-pointer">
                                <div class="card-body text-start">
                                    <i class="fas fa-code text-primary mb-2"></i>
                                    <h6 class="card-title">Code a snake game</h6>
                                    <p class="card-text text-muted small">in Python using Pygame</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </section>

            <footer class="input-area p-3 bg-white border-top">
                <div class="input-container d-flex align-items-end position-relative border rounded-3 p-2 bg-light mx-auto"
                    style="max-width: 800px;">
                    <button class="btn btn-link text-secondary p-2" id="attach-btn">
                        <i class="fas fa-paperclip"></i>
                    </button>
                    <textarea class="form-control border-0 bg-transparent shadow-none" id="chat-input" rows="1"
                        placeholder="Send a message..." style="resize: none;"></textarea>
                    <button class="btn btn-primary p-2 rounded-circle ms-2" id="send-btn" disabled>
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
                <div class="text-center text-muted small mt-2">
                    AI can make mistakes. Consider verifying important information.
                </div>
            </footer>
        </main>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="chat.js"></script>
</body>

</html>
